<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#312e81"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="jacketGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background circle -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)"/>
  <circle cx="200" cy="200" r="190" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Developer Silhouette -->
  <!-- Shoulders & Coat -->
  <path d="M 80 400 Q 200 310 320 400 Z" fill="url(#jacketGrad)"/>
  <path d="M 140 340 L 200 400 L 260 340 Z" fill="#0f172a"/>
  
  <!-- Neck -->
  <rect x="175" y="250" width="50" height="70" rx="8" fill="#fcd34d"/>

  <!-- Head -->
  <ellipse cx="200" cy="200" rx="65" ry="75" fill="#fcd34d"/>

  <!-- Modern Hair -->
  <path d="M 130 190 Q 140 110 200 110 Q 260 110 270 190 C 255 160 230 145 200 145 C 165 145 145 165 130 190 Z" fill="url(#hairGrad)"/>
  <path d="M 135 170 Q 180 130 250 145 C 230 130 190 125 135 170 Z" fill="#334155"/>

  <!-- Sleek Modern Glasses -->
  <rect x="145" y="180" width="45" height="28" rx="6" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
  <rect x="210" y="180" width="45" height="28" rx="6" fill="#0f172a" stroke="#ffffff" stroke-width="2.5"/>
  <line x1="190" y1="194" x2="210" y2="194" stroke="#ffffff" stroke-width="3"/>
  <line x1="135" y1="190" x2="145" y2="190" stroke="#ffffff" stroke-width="2"/>
  <line x1="255" y1="190" x2="265" y2="190" stroke="#ffffff" stroke-width="2"/>

  <!-- Glasses Reflection -->
  <line x1="150" y1="202" x2="175" y2="186" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <line x1="215" y1="202" x2="240" y2="186" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>

  <!-- Friendly Smile -->
  <path d="M 185 240 Q 200 252 215 240" fill="none" stroke="#b45309" stroke-width="3" stroke-linecap="round"/>
</svg>
