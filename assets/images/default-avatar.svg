<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1f1147"/>
      <stop offset="70%" stop-color="#0a071b"/>
      <stop offset="100%" stop-color="#030208"/>
    </radialGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="100%" stop-color="#0066ff"/>
    </linearGradient>
    <linearGradient id="neonPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="cyberGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" fill="url(#bgGlow)"/>

  <!-- Cyber Grid circles -->
  <circle cx="200" cy="200" r="180" fill="none" stroke="#00f3ff" stroke-width="1.5" stroke-dasharray="4,8" opacity="0.4"/>
  <circle cx="200" cy="200" r="160" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.6" filter="url(#cyberGlow)"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#7928ca" stroke-width="1" stroke-dasharray="12,6" opacity="0.5"/>

  <!-- Cyborg Silhouette -->
  <!-- Shoulders -->
  <path d="M 90 380 Q 200 320 310 380 L 330 400 L 70 400 Z" fill="#120f26" stroke="#00f3ff" stroke-width="2"/>
  <path d="M 120 380 Q 200 335 280 380" fill="none" stroke="#ff007f" stroke-width="2" filter="url(#cyberGlow)"/>

  <!-- Neck -->
  <path d="M 170 270 L 230 270 L 225 330 L 175 330 Z" fill="#1a1533"/>
  <line x1="200" y1="280" x2="200" y2="330" stroke="#00f3ff" stroke-width="2" opacity="0.7"/>

  <!-- Head Base -->
  <path d="M 140 170 C 140 100 260 100 260 170 C 260 220 235 270 200 275 C 165 270 140 220 140 170 Z" fill="#15112e" stroke="#00f3ff" stroke-width="2"/>

  <!-- Cybernetic plates & ear gears -->
  <rect x="126" y="170" width="16" height="35" rx="4" fill="#00f3ff" opacity="0.8" filter="url(#cyberGlow)"/>
  <rect x="258" y="170" width="16" height="35" rx="4" fill="#00f3ff" opacity="0.8" filter="url(#cyberGlow)"/>
  
  <!-- Cyber Visor / Glasses -->
  <path d="M 145 160 L 255 160 L 245 195 L 155 195 Z" fill="#ff007f" filter="url(#cyberGlow)" opacity="0.9"/>
  <path d="M 147 165 L 253 165 L 247 175 L 153 175 Z" fill="#00f3ff" opacity="0.9"/>
  <line x1="160" y1="185" x2="240" y2="185" stroke="#ffffff" stroke-width="2" stroke-dasharray="3,3"/>

  <!-- Cyber tattoo / Circuit traces -->
  <path d="M 175 220 L 185 240 L 200 240" fill="none" stroke="#00f3ff" stroke-width="1.5"/>
  <circle cx="200" cy="240" r="2.5" fill="#00f3ff"/>
  <path d="M 225 220 L 215 240 L 205 240" fill="none" stroke="#ff007f" stroke-width="1.5"/>
  
  <!-- Holographic crosshairs -->
  <circle cx="200" cy="200" r="6" fill="none" stroke="#00f3ff" stroke-width="1"/>
  <line x1="200" y1="190" x2="200" y2="210" stroke="#00f3ff" stroke-width="1"/>
  <line x1="190" y1="200" x2="210" y2="200" stroke="#00f3ff" stroke-width="1"/>
</svg>
