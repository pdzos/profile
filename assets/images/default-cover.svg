<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <linearGradient id="deepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="40%" stop-color="#1e1b4b"/>
      <stop offset="80%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="polyGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.05"/>
    </linearGradient>
    <linearGradient id="polyGrad2" x1="100%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>

  <!-- Deep Slate Background -->
  <rect width="1200" height="400" fill="url(#deepGrad)"/>
  <rect width="1200" height="400" fill="url(#centerGlow)"/>

  <!-- Minimalist Geometric Floating Polygons -->
  <polygon points="100,50 350,20 280,220 50,180" fill="url(#polyGrad1)"/>
  <polygon points="750,80 1150,20 1050,300 800,240" fill="url(#polyGrad2)"/>
  <polygon points="400,180 850,120 700,380 320,320" fill="url(#polyGrad1)" opacity="0.6"/>

  <!-- Subtle Minimalist Grid Dots -->
  <g fill="rgba(255,255,255,0.08)">
    <circle cx="200" cy="100" r="2"/><circle cx="260" cy="100" r="2"/><circle cx="320" cy="100" r="2"/><circle cx="380" cy="100" r="2"/>
    <circle cx="200" cy="140" r="2"/><circle cx="260" cy="140" r="2"/><circle cx="320" cy="140" r="2"/><circle cx="380" cy="140" r="2"/>
    <circle cx="200" cy="180" r="2"/><circle cx="260" cy="180" r="2"/><circle cx="320" cy="180" r="2"/><circle cx="380" cy="180" r="2"/>
    <circle cx="820" cy="200" r="2"/><circle cx="880" cy="200" r="2"/><circle cx="940" cy="200" r="2"/><circle cx="1000" cy="200" r="2"/>
    <circle cx="820" cy="240" r="2"/><circle cx="880" cy="240" r="2"/><circle cx="940" cy="240" r="2"/><circle cx="1000" cy="240" r="2"/>
    <circle cx="820" cy="280" r="2"/><circle cx="880" cy="280" r="2"/><circle cx="940" cy="280" r="2"/><circle cx="1000" cy="280" r="2"/>
  </g>

  <!-- Clean Floating Lines -->
  <line x1="0" y1="390" x2="1200" y2="390" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
</svg>
