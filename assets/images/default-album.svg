<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <radialGradient id="albumVinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0845"/>
      <stop offset="35%" stop-color="#0b0818"/>
      <stop offset="70%" stop-color="#14092b"/>
      <stop offset="100%" stop-color="#05020c"/>
    </radialGradient>
    <linearGradient id="neonGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#7928ca"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Album Card Background -->
  <rect width="500" height="500" rx="20" fill="url(#albumVinyl)"/>
  <rect x="2" y="2" width="496" height="496" rx="18" fill="none" stroke="url(#neonGradient)" stroke-width="2" opacity="0.8"/>

  <!-- Vinyl Grooves -->
  <circle cx="250" cy="250" r="220" fill="none" stroke="#251644" stroke-width="2"/>
  <circle cx="250" cy="250" r="195" fill="none" stroke="#1d1238" stroke-width="2"/>
  <circle cx="250" cy="250" r="170" fill="none" stroke="#28174b" stroke-width="1.5" stroke-dasharray="8, 6"/>
  <circle cx="250" cy="250" r="140" fill="none" stroke="#00f3ff" stroke-width="1.5" opacity="0.4" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="110" fill="none" stroke="#ff007f" stroke-width="1.5" opacity="0.5" filter="url(#glow)"/>

  <!-- Center Label Hologram -->
  <circle cx="250" cy="250" r="80" fill="url(#neonGradient)" opacity="0.9" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="75" fill="#0d0822"/>
  
  <!-- Cyber Waveforms in Center -->
  <path d="M 200 250 Q 212 210 225 250 T 250 250 T 275 250 T 300 250" fill="none" stroke="#00f3ff" stroke-width="3" filter="url(#glow)"/>
  <circle cx="250" cy="250" r="20" fill="#05020c" stroke="#ff007f" stroke-width="2"/>
  <circle cx="250" cy="250" r="7" fill="#ffffff"/>

  <!-- Typography -->
  <text x="250" y="80" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="22" fill="#00f3ff" letter-spacing="6" filter="url(#glow)">CYBERWAVE</text>
  <text x="250" y="440" text-anchor="middle" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" fill="#ff007f" letter-spacing="4">NEON SYNTHESIS</text>
</svg>
