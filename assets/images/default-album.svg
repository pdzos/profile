<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="albumGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="circleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Album Background -->
  <rect width="500" height="500" rx="16" fill="url(#albumGrad)"/>
  <rect x="2" y="2" width="496" height="496" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>

  <!-- Minimalist Vinyl Grooves -->
  <circle cx="250" cy="250" r="190" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>
  <circle cx="250" cy="250" r="160" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1.5"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- Center Label -->
  <circle cx="250" cy="250" r="85" fill="url(#circleGrad)" opacity="0.85"/>
  <circle cx="250" cy="250" r="75" fill="#090d16"/>
  <circle cx="250" cy="250" r="22" fill="#1e1b4b" stroke="#ffffff" stroke-width="2"/>
  <circle cx="250" cy="250" r="8" fill="#ffffff"/>

  <!-- Clean Typography -->
  <text x="250" y="85" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="20" fill="#ffffff" letter-spacing="4">PIYUSH AUDIO</text>
  <text x="250" y="435" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-weight="500" font-size="14" fill="#94a3b8" letter-spacing="2">ACOUSTIC ATMOSPHERE</text>
</svg>
