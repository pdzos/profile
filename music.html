<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
  <title>PIYUSH | Audio Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="music.css">
</head>
<body class="music-app-body">

  <!-- Background Visualizer Canvas -->
  <canvas id="visualizer-canvas"></canvas>

  <!-- Top Navigation Bar -->
  <header class="music-navbar">
    <a href="index.html" class="music-back-link">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
        <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
      </svg>
      <span>Back to Portfolio</span>
    </a>
    <div class="music-header-title">PIYUSH AUDIO STUDIO</div>
    <button class="btn btn-sm btn-secondary" id="open-upload-modal-btn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      <span>Upload Track</span>
    </button>
  </header>

  <!-- Main Stage: Center Showcase & Playlist Drawer -->
  <main class="music-main-stage">
    
    <!-- Player Showcase -->
    <section class="music-showcase">
      <!-- Vinyl Disc Artwork -->
      <div class="album-visual-container">
        <div class="vinyl-disc" id="vinyl-disc">
          <img src="assets/images/default-album.svg" alt="Album Cover" class="vinyl-art-img" id="full-cover">
          <div class="vinyl-center-hole"></div>
        </div>
      </div>

      <!-- Live Equalizer Bars -->
      <div class="live-equalizer-bars">
        <div class="eq-bar active"></div>
        <div class="eq-bar active"></div>
        <div class="eq-bar active"></div>
        <div class="eq-bar active"></div>
        <div class="eq-bar active"></div>
        <div class="eq-bar active"></div>
      </div>

      <!-- Track Information -->
      <div class="track-showcase-meta">
        <h1 class="track-showcase-title" id="full-title">Neon Cyber Dream</h1>
        <div class="track-showcase-artist" id="full-artist">SynthWave Matrix</div>
      </div>

      <!-- Controls Panel -->
      <div class="music-controls-panel">
        <!-- Scrubber -->
        <div class="scrub-progress-wrap">
          <span class="time-label" id="full-curr-time">0:00</span>
          <input type="range" class="scrub-slider" id="full-scrub" min="0" max="100" value="0">
          <span class="time-label" id="full-total-time">0:00</span>
        </div>

        <!-- Buttons Bar -->
        <div class="playback-buttons-bar">
          <button class="music-tool-btn" id="full-shuffle-btn" title="Shuffle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"/>
            </svg>
          </button>

          <button class="music-tool-btn" id="full-prev-btn" title="Previous Track">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
            </svg>
          </button>

          <button class="play-toggle-btn" id="full-play-btn" title="Play / Pause">
            <svg id="full-play-icon" width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M8 5v14l11-7z"/>
            </svg>
          </button>

          <button class="music-tool-btn" id="full-next-btn" title="Next Track">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
            </svg>
          </button>

          <button class="music-tool-btn" id="full-repeat-btn" title="Repeat Mode">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z"/>
            </svg>
          </button>

          <button class="music-tool-btn" id="full-fav-btn" title="Favorite">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </button>
        </div>

        <!-- Volume Bar -->
        <div style="display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 6px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="var(--text-muted)">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
          </svg>
          <input type="range" class="volume-slider" id="full-volume" min="0" max="1" step="0.01" value="0.8">
        </div>
      </div>
    </section>

    <!-- Playlist Drawer -->
    <aside class="playlist-drawer">
      <div class="playlist-drawer-header">
        <div class="playlist-header-top">
          <div class="playlist-title">Playlist Library</div>
          <span style="font-size:0.8rem; color:var(--text-muted);">1 Track</span>
        </div>
        <div class="playlist-search-box">
          <svg class="search-icon-pos" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
          </svg>
          <input type="text" id="playlist-search-input" placeholder="Search track or artist...">
        </div>
      </div>

      <!-- Tracks List -->
      <div class="playlist-items-container" id="playlist-items-list">
        <!-- Rendered dynamically by music.js -->
      </div>
    </aside>

  </main>

  <!-- Add Audio Track Modal -->
  <div class="lightbox-modal" id="upload-track-modal" style="background: rgba(9, 13, 22, 0.9);">
    <div style="background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: 16px; padding: 2rem; max-width: 480px; width: 100%;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1.5rem;">
        <h3 style="font-size:1.2rem; font-weight:700;">Upload Audio Track</h3>
        <button id="close-upload-modal" style="background:none; border:none; color:#fff; font-size:1.5rem; cursor:pointer;">&times;</button>
      </div>
      <form id="add-track-form">
        <div style="margin-bottom:1rem;">
          <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:0.4rem;">Audio File (MP3 / WAV)</label>
          <input type="file" id="track-audio-file" accept="audio/*" style="width:100%; padding:0.6rem; background:rgba(255,255,255,0.05); border:1px solid var(--border-subtle); border-radius:8px; color:#fff;" required>
        </div>
        <div style="margin-bottom:1rem;">
          <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:0.4rem;">Track Title</label>
          <input type="text" id="track-title-input" style="width:100%; padding:0.6rem 0.8rem; background:rgba(255,255,255,0.05); border:1px solid var(--border-subtle); border-radius:8px; color:#fff;" required>
        </div>
        <div style="margin-bottom:1.5rem;">
          <label style="display:block; font-size:0.85rem; color:var(--text-muted); margin-bottom:0.4rem;">Artist Name</label>
          <input type="text" id="track-artist-input" style="width:100%; padding:0.6rem 0.8rem; background:rgba(255,255,255,0.05); border:1px solid var(--border-subtle); border-radius:8px; color:#fff;" placeholder="PIYUSH">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:0.8rem;">
          <button type="button" class="btn btn-sm btn-secondary" id="cancel-upload-btn">Cancel</button>
          <button type="submit" class="btn btn-sm btn-primary">Add Track</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Scripts -->
  <script src="db.js"></script>
  <script src="music.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const canvas = document.getElementById('visualizer-canvas');
      window.cyberMusic.startVisualizer(canvas);
      window.cyberMusic.updateAllUI();

      document.getElementById('full-play-btn').addEventListener('click', () => {
        window.cyberMusic.toggle();
      });
      document.getElementById('full-prev-btn').addEventListener('click', () => {
        window.cyberMusic.prev();
      });
      document.getElementById('full-next-btn').addEventListener('click', () => {
        window.cyberMusic.next();
      });
      document.getElementById('full-shuffle-btn').addEventListener('click', () => {
        window.cyberMusic.toggleShuffle();
      });
      document.getElementById('full-repeat-btn').addEventListener('click', () => {
        window.cyberMusic.toggleRepeat();
      });
      document.getElementById('full-fav-btn').addEventListener('click', () => {
        const cur = window.cyberMusic.getCurrentTrack();
        if (cur) window.cyberMusic.toggleFavorite(cur.id);
      });

      const scrubber = document.getElementById('full-scrub');
      scrubber.addEventListener('input', (e) => {
        const dur = window.cyberMusic.audio.duration;
        if (dur) {
          const seekTo = (e.target.value / 100) * dur;
          window.cyberMusic.seek(seekTo);
        }
      });

      const volSlider = document.getElementById('full-volume');
      volSlider.value = window.cyberMusic.volume;
      volSlider.addEventListener('input', (e) => {
        window.cyberMusic.setVolume(parseFloat(e.target.value));
      });

      const searchInput = document.getElementById('playlist-search-input');
      searchInput.addEventListener('input', (e) => {
        window.cyberMusic.renderPlaylistDrawer(e.target.value);
      });

      const uploadModal = document.getElementById('upload-track-modal');
      const openModalBtn = document.getElementById('open-upload-modal-btn');
      const closeModalBtn = document.getElementById('close-upload-modal');
      const cancelModalBtn = document.getElementById('cancel-upload-btn');
      const addTrackForm = document.getElementById('add-track-form');

      const openModal = () => uploadModal.classList.add('active');
      const closeModal = () => {
        uploadModal.classList.remove('active');
        addTrackForm.reset();
      };

      openModalBtn.addEventListener('click', openModal);
      closeModalBtn.addEventListener('click', closeModal);
      cancelModalBtn.addEventListener('click', closeModal);

      const audioInput = document.getElementById('track-audio-file');
      audioInput.addEventListener('change', () => {
        if (audioInput.files && audioInput.files[0]) {
          const name = audioInput.files[0].name.replace(/\.[^/.]+$/, "");
          const titleBox = document.getElementById('track-title-input');
          if (!titleBox.value) titleBox.value = name;
        }
      });

      addTrackForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const audioFile = audioInput.files[0];
        if (!audioFile) return;

        const title = document.getElementById('track-title-input').value;
        const artist = document.getElementById('track-artist-input').value || 'PIYUSH';

        await window.cyberMusic.addTrack(audioFile, title, artist, null);
        closeModal();
      });
    });
  </script>
</body>
</html>
